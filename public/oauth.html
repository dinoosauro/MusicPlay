<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Result</title>
</head>
<body>
    <p>If the login has been successful, this webpage will automatically be closed.</p>
    <script>
        const params = new URLSearchParams(window.location.search.substring(1));
        const token = params.get("token");
        if (token) {
            window.opener.postMessage({token}, window.location.origin); 
            window.close();
        }
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const [iss, gtoken] = [hashParams.get("iss"), hashParams.get("access_token")];
        if (iss && gtoken) {
            window.opener.postMessage({gtoken}, window.location.origin);
            window.close();
        }
        const code = params.get("code");
        if (code) {
            window.opener.postMessage({code}, window.location.origin);
            window.close();
        }
    </script>
</body>
</html>
